# MiniOS Flux: lightweight XRender compositing with Tomas M's window styling.
# User configuration in $XDG_CONFIG_HOME takes precedence over this default.
backend = "xrender";
vsync = true;
# Keep Slax's full repaint policy to avoid stale pixels on translucent windows.
use-damage = false;
use-ewmh-active-win = true;

xrender-round-top-only = true;
corner-radius = 0;
xrender-window-outline = true;
xrender-outline-active-color = "#7f8792";
xrender-outline-inactive-color = "#a6adb5";
xrender-outline-radius = 8;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
frame-opacity = 1;
# Rectangular XRender shadows do not follow the rounded outline.
shadow = false;

rules = (
    { match = "!override_redirect && (window_type = 'normal' || window_type = 'dialog')"; outline = true; },
    { match = "!override_redirect && border_width > 0"; corner-radius = 8; },
    { match = "!override_redirect && !argb && (window_type = 'normal' || window_type = 'dialog')"; corner-radius = 8; },
    { match = "window_type != 'normal' && window_type != 'dialog'"; fade = false; },
    { match = "role *= 'fluxbox-toolbar'"; opacity = 0.7; },
    { match = "window_type = 'desktop' || window_type = 'dock'"; corner-radius = 0; outline = false; fade = false; },
    { match = "class_g = 'xlunch' || class_g = 'xlunch-windowed' || name = 'xlunch'"; corner-radius = 0; outline = false; shadow = false; fade = false; },
    { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; outline = false; shadow = false; },
    { match = "fullscreen"; corner-radius = 0; outline = false; shadow = false; }
);
