[General]
panels=panel1

[panel1]
plugins=mainmenu,quicklaunch,taskbar,kbindicator,statusnotifier,tray,volume,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=48
iconSize=32
width=100
width-percent=true
lockPanel=true

[mainmenu]
type=mainmenu
alignment=Left
ownIcon=true
icon=/usr/share/pixmaps/MiniOS-white.svg

[quicklaunch]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\size=2

[taskbar]
type=taskbar
alignment=Left
buttonStyle=Icon
groupingEnabled=true
showOnlyOneDesktopTasks=false

[kbindicator]
type=kbindicator
alignment=Right

[statusnotifier]
type=statusnotifier
alignment=Right

[tray]
type=tray
alignment=Right

[volume]
type=volume
alignment=Right
audioEngine=PulseAudio

[worldclock]
type=worldclock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
