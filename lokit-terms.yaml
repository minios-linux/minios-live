exact:
  - id: docs-boot-menu.start-minios
    source: Start MiniOS
    when:
      target: docs
    translations:
      de: MiniOS starten
      es: Iniciar MiniOS
      fr: Démarrer MiniOS
      id: Mulai MiniOS
      it: Avviare MiniOS
      pt-BR: Iniciar MiniOS
      ru: Запустить MiniOS

  - id: docs-boot-menu.start-new-session
    source: Start a new session
    when:
      target: docs
    translations:
      de: Neue Sitzung beginnen
      es: Iniciar nueva sesión
      fr: Démarrer une nouvelle session
      id: Mulai sesi baru
      it: Avviare una nuova sessione
      pt-BR: Iniciar nova sessão
      ru: Начать новую сессию

  - id: docs-boot-menu.choose-saved-session
    source: Choose a saved session
    when:
      target: docs
    translations:
      de: Gespeicherte Sitzung auswählen
      es: Elegir una sesión guardada
      fr: Choisir une session enregistrée
      id: Pilih sesi yang disimpan
      it: Scegliere una sessione salvata
      pt-BR: Escolher uma sessão salva
      ru: Выбрать сохранённую сессию

  - id: docs-boot-menu.start-without-saving
    source: Start without saving
    when:
      target: docs
    translations:
      de: Ohne Speichern starten
      es: Iniciar sin guardar
      fr: Démarrer sans enregistrer
      id: Mulai tanpa menyimpan
      it: Avviare senza salvare
      pt-BR: Iniciar sem salvar
      ru: Запустить без сохранения

  - id: docs-boot-menu.run-from-ram
    source: Run from RAM
    when:
      target: docs
    translations:
      de: Aus dem RAM ausführen
      es: Ejecutar desde RAM
      fr: Exécuter depuis la RAM
      id: Jalankan dari RAM
      it: Eseguire dalla RAM
      pt-BR: Executar a partir da RAM
      ru: Запустить из RAM

  - id: docs-site.fast-simple-reliable
    source: Fast. Simple. Reliable.
    when:
      target: docs
    translations:
      de: Schnell. Einfach. Zuverlässig.
      es: Rápido. Simple. Fiable.
      fr: Rapide. Simple. Fiable.
      id: Cepat. Sederhana. Andal.
      it: Veloce. Semplice. Affidabile.
      pt-BR: Rápido. Simples. Confiável.
      ru: Быстро. Просто. Надёжно.

  - id: docs-site.description
    source: Lightweight, portable, and modular Linux distribution based on Debian.
    when:
      target: docs
    translations:
      de: Leichtgewichtige, portable und modulare Linux-Distribution auf Debian-Basis.
      es: Distribución Linux ligera, portátil y modular basada en Debian.
      fr: Distribution Linux légère, portable et modulaire basée sur Debian.
      id: Distribusi Linux berbasis Debian yang ringan, portabel, dan modular.
      it: Distribuzione Linux leggera, portatile e modulare basata su Debian.
      pt-BR: Distribuição Linux leve, portátil e modular baseada no Debian.
      ru: Легковесный, портативный и модульный дистрибутив Linux на базе Debian.

  - id: docs-site.why-minios
    source: Why MiniOS?
    when:
      target: docs
    translations:
      de: Warum MiniOS?
      es: ¿Por qué MiniOS?
      fr: Pourquoi MiniOS ?
      id: Mengapa MiniOS?
      it: Perché MiniOS?
      pt-BR: Por que o MiniOS?
      ru: Почему MiniOS?

  - id: docs-site.live-boot-title
    source: Live Boot System
    when:
      target: docs
    translations:
      de: Live-Boot-System
      es: Sistema de arranque en vivo
      fr: Système de démarrage Live
      id: Sistem Live Boot
      it: Sistema Live Boot
      pt-BR: Sistema Live Boot
      ru: Система Live Boot

  - id: docs-site.live-boot-description
    source: Works on virtually any x86-64 computer. Your OS travels with you.
    when:
      target: docs
    translations:
      de: Läuft auf praktisch jedem x86-64-Computer. Ihr Betriebssystem reist mit Ihnen.
      es: Funciona en prácticamente cualquier ordenador x86-64. Tu SO viaja contigo.
      fr: Fonctionne sur pratiquement n'importe quel ordinateur x86-64. Votre OS vous suit partout.
      id: Berjalan di hampir semua komputer x86-64. OS Anda ikut ke mana pun Anda pergi.
      it: Funziona su quasi tutti i computer x86-64. Il tuo OS viaggia con te.
      pt-BR: Funciona em praticamente qualquer computador x86-64. Seu sistema operacional viaja com você.
      ru: Работает практически на любом компьютере x86-64. Ваша ОС всегда с вами.

  - id: docs-site.persistence-title
    source: USB Persistence
    when:
      target: docs
    translations:
      de: USB-Persistenz
      es: Persistencia en USB
      fr: Persistance USB
      id: Persistensi USB
      it: Persistenza USB
      pt-BR: Persistência em USB
      ru: USB Persistence (сохранение данных)

  - id: docs-site.persistence-description
    source: Your personal portable OS. Everything saves automatically to your USB drive.
    when:
      target: docs
    translations:
      de: Ihr persönliches, portables Betriebssystem. Alles wird automatisch auf Ihrem USB-Stick gespeichert.
      es: Tu SO personal portátil. Todo se guarda automáticamente en tu unidad USB.
      fr: Votre OS portable personnel. Tout s'enregistre automatiquement sur votre clé USB.
      id: OS portabel pribadi Anda. Semuanya disimpan secara otomatis ke drive USB Anda.
      it: Il tuo OS portatile personale. Tutto viene salvato automaticamente sull'unità USB.
      pt-BR: Seu sistema operacional portátil pessoal. Tudo é salvo automaticamente no seu pendrive.
      ru: Ваша личная портативная ОС. Все данные автоматически сохраняются на USB-накопитель.

  - id: docs-site.debian-title
    source: Debian Foundation
    when:
      target: docs
    translations:
      de: Debian Foundation
      es: Debian Foundation
      fr: Debian Foundation
      id: Debian Foundation
      it: Debian Foundation
      pt-BR: Debian Foundation
      ru: Debian Foundation

  - id: docs-site.debian-description
    source: Built on Debian Stable foundation. Enterprise reliability meets desktop usability.
    when:
      target: docs
    translations:
      de: Basiert auf Debian Stable. Zuverlässigkeit für Unternehmen trifft auf Desktop-Benutzerfreundlichkeit.
      es: Basado en la base estable de Debian. Fiabilidad empresarial con la usabilidad de un escritorio.
      fr: Basé sur Debian Stable. La fiabilité d'entreprise alliée à la simplicité d'utilisation.
      id: Dibangun di atas fondasi Debian Stable. Keandalan kelas perusahaan berpadu dengan kemudahan penggunaan desktop.
      it: Basato sulla stabilità di Debian. L'affidabilità aziendale incontra l'usabilità desktop.
      pt-BR: Construído sobre a base estável do Debian. Confiabilidade empresarial com usabilidade de desktop.
      ru: Основано на базе Debian Stable. Корпоративная надёжность в сочетании с удобством рабочего стола.

  - id: docs-site.modular-title
    source: Modular Architecture
    when:
      target: docs
    translations:
      de: Modulare Architektur
      es: Arquitectura modular
      fr: Architecture modulaire
      id: Arsitektur Modular
      it: Architettura modulare
      pt-BR: Arquitetura Modular
      ru: Модульная архитектура

  - id: docs-site.modular-description
    source: Extend system with SquashFS modules. Load only what you need, keep it lightweight and flexible.
    when:
      target: docs
    translations:
      de: Erweitern Sie das System mit SquashFS-Modulen. Laden Sie nur das, was Sie brauchen – schlank und flexibel.
      es: Amplíe el sistema con módulos SquashFS. Cargue solo lo que necesite, manteniéndolo ligero y flexible.
      fr: Étendez le système avec des modules SquashFS. Ne chargez que ce dont vous avez besoin, restez léger et flexible.
      id: Perluas sistem dengan modul SquashFS. Muat hanya yang Anda butuhkan, tetap ringan dan fleksibel.
      it: Estendi il sistema con i moduli SquashFS. Carica solo ciò di cui hai bisogno, mantenendolo leggero e flessibile.
      pt-BR: Estenda o sistema com módulos SquashFS. Carregue apenas o necessário, mantenha-o leve e flexível.
      ru: Расширяйте систему с помощью модулей SquashFS. Загружайте только необходимое, сохраняя легкость и гибкость системы.

