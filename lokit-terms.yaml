    when:
      target: docs
    translations:
      de: Leichtgewichtige, portable und modulare Linux-Distribution auf Debian-Basis.
      es: Distribución Linux ligera, portátil y modular basada en Debian.
      fr: Distribution Linux légère, portable et modulaire basée sur Debian.
      id: Distribusi Linux berbasis Debian yang ringan, portabel, dan modular.
      it: Distribuzione Linux leggera, portatile e modulare basata su Debian.
      pt-BR: Distribuição Linux leve, portátil e modular baseada no Debian.
      ru: Легковесный, портативный и модульный дистрибутив Linux на базе Debian.

