  - id: filesystem.squashfs
    source: SquashFS
    preserve: true
    case_sensitive: true

  - id: tool.condinapt
    source: CondinAPT
    preserve: true
    case_sensitive: true

  - id: tool.rufus
    source: Rufus
    preserve: true
