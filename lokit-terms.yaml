  - id: minios-session-manager.no-persistent-storage
    source: Persistent sessions are unavailable — the system is running without changes storage.
    when:
      target: minios-session-manager
    translations:
      de: Persistente Sitzungen sind nicht verfügbar – das System läuft ohne Speicher für Änderungen.
      es: 'Las sesiones persistentes no están disponibles: el sistema se está ejecutando sin almacenamiento de cambios.'
      fr: Les sessions persistantes ne sont pas disponibles — le système fonctionne sans stockage des modifications.
      id: Sesi persisten tidak tersedia — sistem berjalan tanpa penyimpanan perubahan.
      it: 'Le sessioni persistenti non sono disponibili: il sistema è in esecuzione senza memoria per la conservazione delle modifiche.'
      pt: Sessões persistentes indisponíveis — o sistema está sendo executado sem armazenamento de alterações.
      pt-BR: Sessões persistentes indisponíveis — o sistema está sendo executado sem armazenamento de alterações.
      ru: Постоянные сессии недоступны — система запущена без хранилища изменений.

