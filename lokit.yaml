# lokit configuration for minios-live
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/minios-linux/lokit/master/lokit.schema.json

languages: [de, es, fr, id, it, pt, pt-BR, ru]
source_lang: en

terminology:
  from:
    - lokit-terms.yaml

targets:
  # --- minios-live own translations ---

  - name: minios-live
    format: gettext
    template: po/messages.pot
    to: po/{lang}.po

  - name: minios-live-manpages
    format: po4a
    root: manpages
    from:
      - po4a.cfg

  - name: grub-theme
    format: gettext
    root: linux-live/bootfiles/boot/grub
    from:
      - po/en_US.po
    template: po/messages.pot
    to: po/{lang}.po
    languages: [de_DE, es_ES, fr_FR, id_ID, it_IT, pt_PT, pt_BR, ru_RU]

  # --- submodule: minios-tools ---

  - name: minios-tools
    format: gettext
    root: submodules/minios-tools
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: flux-tools ---

  - name: flux-tools
    format: gettext
    root: submodules/flux-tools
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: driveutility ---

  - name: driveutility
    format: gettext
    root: submodules/driveutility
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-installer ---

  - name: minios-installer
    format: gettext
    root: submodules/minios-installer
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-configurator ---

  - name: minios-configurator
    format: gettext
    root: submodules/minios-configurator
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-kernel-manager ---

  - name: minios-kernel-manager
    format: gettext
    root: submodules/minios-kernel-manager
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-session-manager ---

  - name: minios-session-manager
    format: gettext
    root: submodules/minios-session-manager
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-module-manager ---

  - name: minios-module-manager
    format: gettext
    root: submodules/minios-module-manager
    template: po/messages.pot
    to: po/{lang}.po

  - name: minios-module-manager-desktop
    format: desktop
    root: submodules/minios-module-manager
    to: share/applications/minios-module-manager.desktop
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  - name: minios-module-manager-manpages
    format: po4a
    root: submodules/minios-module-manager/manpages
    from:
      - po4a.cfg
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  # --- submodule: minios-help ---

  - name: minios-help
    format: gettext
    root: submodules/minios-help
    template: po/messages.pot
    to: po/{lang}.po
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  - name: minios-help-desktop
    format: desktop
    root: submodules/minios-help
    to: share/applications/dev.minios.Help.desktop
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  # --- submodule: minios-image-builder ---

  - name: minios-image-builder
    format: gettext
    root: submodules/minios-image-builder
    except:
      - cli/**/*
      - manpages/**/*
    template: po/messages.pot
    to: po/{lang}.po

  - name: minios-image-builder-help
    format: markdown
    root: submodules/minios-image-builder/share/help/en
    from:
      - '**/*.md'
    to: '../{lang}/{path}'
    languages: [de, es, fr, id, it, pt, pt-BR, ru]

  - name: minios-image-compose
    format: gettext
    root: submodules/minios-image-builder/cli
    from:
      - bin
      - lib
    template: po/messages.pot
    to: po/{lang}.po

  - name: minios-image-builder-desktop
    format: desktop
    root: submodules/minios-image-builder
    to: share/applications/minios-image-builder.desktop
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  - name: minios-image-builder-policy
    format: polkit
    root: submodules/minios-image-builder
    to: share/polkit-1/actions/org.minios.imagebuilder.read-live-config.policy
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  - name: minios-image-builder-manpages
    format: po4a
    root: submodules/minios-image-builder/manpages
    from:
      - po4a.cfg
    languages: [de, es, fr, id, it, pt, pt_BR, ru]
    prompt: |
      Translate MiniOS man pages while preserving all groff markup, command names, options, paths, placeholders, and technical identifiers exactly.
      Use ordinary ASCII spaces only. Never insert non-breaking spaces or escaped representations of non-breaking spaces.
      Preserve every backslash escape byte-for-byte with exactly the same number of backslashes. Never translate groff escapes such as \f[B], \f[R], \[en], \[aq], \[dq], or \[rs].

  # --- submodule: minios-live-config manpages ---

  - name: minios-live-config
    format: po4a
    root: submodules/minios-live-config/manpages
    from:
      - po4a.cfg
    languages: [de, es, fr, id, it, ja, pt, pt_BR, ru]

  # --- submodule: documentation site (markdown) ---

  - name: docs
    format: markdown
    root: submodules/docs
    ignored_patterns:
      - '^fm:updated$'
      - '^fm:program_commits\.'
    from:
      - index.md
      - about/**/*.md
      - administration/**/*.md
      - configuration/**/*.md
      - development/**/*.md
      - installation/**/*.md
    to: translations/{lang}/{path}
    languages: [de, es, fr, id, it, pt-BR, ru]

  - name: docs-ui
    format: vue-i18n
    root: submodules/docs
    from:
      - .vitepress/i18n/en.json
    to: .vitepress/i18n/{lang}.json
    languages: [de, es, fr, id, it, pt-BR, ru]
    prompt: |
      Translate short UI labels for the MiniOS documentation website.
      Stay close to the English source meaning; do not invent a different product, website, app, company, or footer.
      Preserve HTML tags, links, URLs, placeholders, punctuation, and copyright years exactly.
      Use concise, natural documentation/navigation terminology for the target language.

  # --- submodule: welcome screen (js-kv) ---

  - name: minios-welcome
    format: js-kv
    root: submodules/minios-welcome
    from:
      - html/js/translations/de.js
    to: html/js/translations/{lang}.js
    languages: [de, es, fr, id, it, pt, pt_BR, ru]

  # --- submodule: website (i18next) ---

  - name: minios-linux.github.io
    format: i18next
    root: submodules/minios-linux.github.io
    from:
      - public/translations/en.json
    to: public/translations/{lang}.json
    languages: [de, es, fr, id, it, pt-BR, ru]

  # --- submodule: website blog posts (markdown) ---

  - name: minios-linux.github.io-blog-posts
    format: markdown
    root: submodules/minios-linux.github.io
    from:
      - data/blog/posts/{id}.md
    to: data/blog/posts/translations/{id}.{lang}.md
    languages: [de, es, fr, id, it, pt-BR, ru]

  # --- submodule: flux website (json) ---

  - name: flux-website
    format: i18next
    root: submodules/flux.minios.dev
    from:
      - translations/en.json
    to: translations/{lang}.json
    languages: [de, es, fr, id, it, pt-BR, pt-PT, ru]

  # --- submodule: minios-store application ---

  - name: minios-store
    format: gettext
    root: submodules/minios-store
    template: po/messages.pot
    to: po/{lang}.po

  # --- submodule: minios-store website (i18next) ---

  - name: minios-store-website
    format: i18next
    root: submodules/minios-store/web
    from:
      - public/translations/en.json
    to: public/translations/{lang}.json
    languages: [de, es, fr, id, it, pt-BR, ru]

  # --- submodule: minios-store recipes (json) ---

  - name: minios-store-recipes
    format: vue-i18n
    root: submodules/minios-store/web/public/data
    to: recipe-translations/{lang}/{id}.json
    languages: [de, es, fr, id, it, pt-BR, ru]
    from:
      index: recipes.json
      records: "$"
      key: id
      fields: [name, description, longDescription]
